[package]
name = "steward"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.89"
description = "Read-only proxy inventory and route planning foundation for Steward"
repository = "https://github.com/samishal1998/steward"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
