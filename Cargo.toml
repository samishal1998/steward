[package]
name = "steward"
version = "0.2.0-alpha.2"
edition = "2024"
rust-version = "1.89"
description = "Checked proxy routes, native services, and recoverable operations"
repository = "https://github.com/samishal1998/steward"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.0", features = ["unstable-dynamic"] }
libc = "0.2"
crossterm = "0.29"
shlex = "2.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10.9"
tempfile = "3.27.0"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
