name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --check
      - name: Tests (synthetic fixtures and disposable HTTP servers)
        run: cargo +1.98.0 test --locked -- --test-threads=1
      - name: Lint
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --locked
