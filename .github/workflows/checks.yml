name: Rust checks

on:
  push:
    branches: [main, feature/complete-management]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --check
      - name: Tests (synthetic fixtures and disposable HTTP servers)
        run: cargo +1.98.0 test --locked -- --test-threads=1
      - name: Lint
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - name: Installer contracts
        run: sh -n install.sh && python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch pinned test-only proxy executables
        run: python3 -B scripts/fetch_test_proxies.py --dir "$RUNNER_TEMP/steward-proxies"
      - name: Real local route lifecycle and recovery
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/live_route_smoke.py --binary target/debug/steward --caddy "$RUNNER_TEMP/steward-proxies/caddy" --traefik "$RUNNER_TEMP/steward-proxies/traefik"
      - name: Caddyfile imports and internal HTTPS
        run: |
          python3 -B scripts/live_tls_files.py --binary target/debug/steward --caddy "$RUNNER_TEMP/steward-proxies/caddy"
          python3 -B scripts/live_tls_native.py --binary target/debug/steward --caddy "$RUNNER_TEMP/steward-proxies/caddy" --traefik "$RUNNER_TEMP/steward-proxies/traefik"
      - name: Prepare disposable Linux user supervisor
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          printf 'XDG_RUNTIME_DIR=/run/user/%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$(id -u)" "$(id -u)" >> "$GITHUB_ENV"
      - name: Real native services and composition
        run: |
          python3 -B scripts/live_services.py --binary target/debug/steward
          python3 -B scripts/live_stack_setup.py --binary target/debug/steward
      - name: Interactive terminal acceptance
        run: python3 -B scripts/live_tui.py --binary target/debug/steward
      - name: Docker controller and container target acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          image=lucaslorentz/caddy-docker-proxy@sha256:3e6cf4a6382da0cd14108a69929d7f8cc59e9a59cae4c9795071fa392ffa8036
          docker pull "$image"
          extraction=$(docker create "$image")
          trap 'docker rm -f "$extraction" >/dev/null 2>&1 || true' EXIT
          docker cp "$extraction:/bin/caddy" "$RUNNER_TEMP/steward-proxies/controller"
          python3 -B scripts/live_controller.py --binary target/debug/steward --controller "$RUNNER_TEMP/steward-proxies/controller"
          docker pull ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
          python3 -B scripts/live_container.py --binary target/debug/steward --caddy "$RUNNER_TEMP/steward-proxies/caddy"
      - name: SSH target acceptance
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          python3 -B scripts/live_ssh.py --binary target/debug/steward --caddy "$RUNNER_TEMP/steward-proxies/caddy"

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --locked

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
