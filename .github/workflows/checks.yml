name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --check
      - name: Tests (synthetic fixtures and disposable HTTP servers)
        run: cargo +1.98.0 test --locked -- --test-threads=1
      - name: Lint
        run: cargo +1.98.0 clippy --locked --all-targets -- -D warnings
      - name: Installer contracts
        run: sh -n install.sh && python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch pinned test-only proxy executables
        run: python3 -B scripts/fetch_test_proxies.py --dir "$RUNNER_TEMP/steward-proxies"
      - name: Real local route lifecycle and recovery
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/live_route_smoke.py --binary target/debug/steward --caddy "$RUNNER_TEMP/steward-proxies/caddy" --traefik "$RUNNER_TEMP/steward-proxies/traefik"

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --locked

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
